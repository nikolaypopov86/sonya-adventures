[project]
name = "sonya-adventures"
version = "0.3.1"
description = "A simple arcade game"
authors = [
    {name = "nikolaypopov86",email = "nikolaypopov.perm@gmail.com"}
]
readme = "readme.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv (==1.2.2)",
    "imageio (==2.37.3)",
    "arcade (==4.0.0.dev5)",
    "pyglet (==3.0.dev3)",
    "attrs (==26.1.0)",
    "numpy (==2.5.0rc1)",
]
keywords = [
    "cat",
    "arcade",
    "game",
    "platformer"
]
repository = "https://github.com/nikolaypopov86/sonya-adventures"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.dev.dependencies]
nuitka = "^2.7.13"
